<link rel="stylesheet" href="assets/hibi.css">
<style>
  .ftabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 14px 0 0; }
  .ftabs button { border: 1px solid var(--line); background: #fff; border-radius: 10px 10px 0 0; padding: 8px 2px; font-size: 12px; cursor: pointer; min-height: 44px; line-height: 1.3; color: var(--ink); }
  .ftabs button.on { background: #2a2630; color: #fff; border-color: #2a2630; }
  .ftabs button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-left: 3px; vertical-align: 2px; }
  .pane { border: 1px solid var(--line); border-radius: 0 0 12px 12px; overflow: hidden; }
  /* こもれびの古いホームページ（2003年ごろ） */
  .old { background: #f3ecd8; color: #3b2a12; font-family: "MS PGothic", "Osaka", "Hiragino Kaku Gothic ProN", sans-serif; padding: 14px; font-size: 14px; }
  .old h2 { text-align: center; color: #6b3a10; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; margin: 6px 0; font-size: 24px; letter-spacing: .2em; }
  .old .marq { background: #6b3a10; color: #fff3d0; font-size: 13px; padding: 2px 0; overflow: hidden; white-space: nowrap; }
  .old .marq span { display: inline-block; padding-left: 100%; animation: marq 16s linear infinite; }
  @keyframes marq { to { transform: translateX(-100%); } }
  .old a { color: #0000cc; }
  .old .counter { font-family: "Courier New", monospace; background: #000; color: #0f0; padding: 0 6px; letter-spacing: .2em; cursor: pointer; }
  .old table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
  .old td { border: 1px solid #c8b890; padding: 4px 6px; }
  .old .ura { color: #f3ecd8; transition: color 1.6s; }
  .old .ura.show { color: #a0101a; }
  .old hr { border: 0; border-top: 2px dotted #c8a870; }
  .old canvas { display: block; width: min(320px, 100%); margin: 8px auto; border: 6px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  /* 掲示板 */
  .bbs { background: #efefef; color: #000; font-family: "MS PGothic", "Osaka", "Hiragino Kaku Gothic ProN", sans-serif; padding: 12px; font-size: 14px; }
  .bbs h2 { color: #c00; font-size: 17px; margin: 0 0 10px; }
  .bbs dt { margin-top: 10px; font-size: 13px; }
  .bbs dt b { color: #228b22; }
  .bbs dd { margin: 2px 0 0 1em; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bbs .new { animation: newpost 2s ease; }
  @keyframes newpost { from { background: #ffd0d0; } to { background: transparent; } }
  /* 新聞 */
  .news { background: #f6f2e8; color: #111; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; padding: 16px; }
  .news .paper { font-size: 12px; color: #555; border-bottom: 3px double #333; padding-bottom: 4px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .news h2 { font-size: clamp(20px, 6vw, 28px); margin: 10px 0 2px; line-height: 1.3; }
  .news h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
  .news p { text-indent: 1em; line-height: 1.95; margin: 6px 0; font-size: 15px; }
  .news figure { margin: 10px auto; width: min(240px, 100%); text-align: center; }
  .news figure canvas { width: 100%; filter: grayscale(1) contrast(1.1); cursor: zoom-in; }
  .news figcaption { font-size: 12px; color: #444; }
  /* 物件 */
  .estate { background: #fff; color: #222; padding: 14px; font-size: 14px; }
  .estate h2 { font-size: 17px; margin: 0 0 8px; color: #0a6a3a; }
  .estate table { width: 100%; border-collapse: collapse; }
  .estate th, .estate td { border-bottom: 1px solid #e3e3e3; padding: 6px 4px; text-align: left; vertical-align: top; }
  .estate th { width: 7em; color: #666; font-weight: normal; }
  .estate .tag { display: inline-block; background: #e8f5ee; color: #0a6a3a; border-radius: 4px; padding: 0 6px; font-size: 12px; margin: 2px 4px 2px 0; }
  .estate .red { color: #c00; font-weight: bold; }
  /* 偽クラッシュ */
  .crash { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .crash .dlg { background: #fff; color: #222; width: min(380px, 100%); border-radius: 8px; padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.4); font-family: system-ui, sans-serif; }
  .crash .dlg h4 { margin: 0 0 8px; font-size: 16px; }
  .crash .dlg p { margin: 0 0 14px; font-size: 13px; color: #555; }
  .crash .dlg .bs { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .crash .dlg button { border: 1px solid #ccc; background: #f4f4f4; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .crash .dlg button.p { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  body.frozen .wrap { filter: grayscale(.8) brightness(.9); pointer-events: none; }
  .dwdlink { display: block; margin: 12px 0 4px; padding: 12px; background: #000; color: #e22 !important; text-align: center; font-family: "Courier New", monospace; letter-spacing: .2em; text-decoration: none; border: 1px solid #600; }
</style>

<script src="assets/dwd.js"></script>
<script src="assets/hibi.js"></script>
<script>
(function () {
  'use strict';
  HIBI.nav();
  HIBI.tabHaunt();
  var pane = document.getElementById('pane');
  var tabs = DWD.$$('#ftabs button');
  var seen = DWD.get('fileTabs') || {};
  var stage = DWD.get('stage');
  var crashed = !!DWD.get('filesDone');
  var startedAt = Date.now();
  var cur = null;

  function markDots() {
    tabs.forEach(function (b) {
      var p = b.dataset.p;
      var dot = b.querySelector('.dot');
      if (!seen[p] && !dot) { dot = document.createElement('span'); dot.className = 'dot'; b.appendChild(dot); }
      if (seen[p] && dot) dot.remove();
    });
  }

  function show(p) {
    cur = p;
    tabs.forEach(function (b) { b.classList.toggle('on', b.dataset.p === p); });
    pane.innerHTML = '';
    pane.appendChild(document.getElementById('t-' + p).content.cloneNode(true));
    seen[p] = true;
    DWD.set('fileTabs', seen);
    markDots();
    DWD.sfx.blip();
    if (p === 'cafe') setupCafe();
    if (p === 'news') setupNews();
    if (p === 'bbs' && crashed) addFinalPost(false);
    if (p === 'room') document.getElementById('estUpd').textContent = '2026/11/05 02:13（' + DWD.today() + ' 再更新）';
    window.scrollTo(0, 0);
  }

  // 店主のことば：白い文字（なぞる・3回タップで見える）
  function setupCafe() {
    var taps = 0;
    var words = document.getElementById('words');
    words.addEventListener('click', function () {
      taps++;
      if (taps === 3) {
        document.getElementById('ura').classList.add('show');
        DWD.sfx.whisper(2);
      }
    });
    document.getElementById('counter').addEventListener('click', function () {
      this.textContent = '000204';
      DWD.sfx.knock(1);
    });
  }
  var newsOpen = 0;
  function setupNews() {
    var cv = document.getElementById('harukaPic');
    HIBI.photo(cv, 'haruka', {});
    cv.addEventListener('click', function () {
      newsOpen++;
      // 2回目に開くと、写真の顔が……
      HIBI.viewer(function (big) { HIBI.photo(big, 'haruka', { scratch: newsOpen >= 2, black: newsOpen >= 3 }); }, '間宮はるかさん（家族提供）', function () {
        if (newsOpen === 3) setTimeout(function () { DWD.flash(120, 'girl'); }, 800);
      });
    });
  }

  // 掲示板の最後の書き込み（DarkWebDark への入口）
  function addFinalPost(fresh) {
    var th = document.getElementById('thread');
    if (!th || th.querySelector('.final')) return;
    var dt = document.createElement('dt');
    dt.className = 'final' + (fresh ? ' new' : '');
    dt.innerHTML = '15 ：<b>通りすがり</b>：2026/11/05(木) 02:13';
    var dd = document.createElement('dd');
    dd.className = fresh ? 'new' : '';
    dd.textContent = 'まいさんのページを見ている人へ。\n\n' +
      '「DarkWebDark」という裏サイトがある。ゆきさんのブログの奥にあったやつ。\n' +
      'あそこの いちばん下に、202と203の「あいだ」がある。まいさんはそこにいる。ゆきさんも。ほかの人も。\n' +
      '入口は LAYER 01 の、うらがわ。\n\n' +
      '大家（間宮さん）の台帳に、ぜんぶ書いてある。ログインには、ゆきさんの部屋番号と、ノックの時刻と、大家の名字が要るはず。\n\n' +
      'ひとつだけ。かべの中で、こたえたら、あなたも はいる。';
    var a = document.createElement('a');
    a.className = 'dwdlink';
    a.href = 'dwd/6/index.html';
    a.textContent = 'DarkWebDark ／ LAYER 06 ▶';
    a.addEventListener('click', function (e) {
      e.preventDefault();
      DWD.go(a.getAttribute('href'), 900);
    });
    dd.appendChild(a);
    th.appendChild(dt);
    th.appendChild(dd);
    if (fresh) setTimeout(function () { dd.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 300);
  }

  // すべての資料を見たあと、ページが「応答しなくなる」
  function maybeCrash() {
    if (crashed) return false;
    var all = ['cafe', 'bbs', 'news', 'room'].every(function (k) { return seen[k]; });
    if (!all || Date.now() - startedAt < 15000 * DWD.speed()) return false;
    crashed = true;
    document.body.classList.add('frozen');
    DWD.sfx.static(0.3, 0.2);
    setTimeout(function () {
      var c = document.createElement('div');
      c.className = 'crash';
      c.innerHTML = '<div class="dlg"><h4>このページは応答していません</h4><p>ページが応答するまで待つか、ページを閉じることができます。</p><div class="bs"><button type="button" data-a="wait">待つ</button><button type="button" class="p" data-a="close">ページを閉じる</button></div></div>';
      document.body.appendChild(c);
      c.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        c.remove();
        DWD.scare({ type: 'hands', dur: 1300 }).then(function () {
          document.body.classList.remove('frozen');
          DWD.set('filesDone', true);
          HIBI.unlock('dwd');
          show('bbs');
          addFinalPost(true);
          DWD.sfx.knock(3);
        });
      });
    }, 1200);
    return true;
  }

  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      if (DWD.isScaring() || document.body.classList.contains('frozen')) return;
      if (maybeCrash()) return;
      show(b.dataset.p);
    });
  });

  /* ------------------------------------------------------------
   * END3「おかえり、はるか」の舞台
   * ---------------------------------------------------------- */
  if (stage === 'end3') {
    show('cafe');
    DWD.gate({ title: '……　コーヒーの　におい', button: 'めを　あける' }).then(end3);
    return;
  }
  function end3() {
    document.body.classList.remove('cold');
    var news = document.getElementById('cafeNews');
    news.innerHTML = '<b style="color:#a0101a">■ 2026年11月5日　おしらせ</b><p>28年ぶりに、娘の はるか が帰ってきました。<br>今日から、娘とふたりでお店に立ちます。<br>はるかのプリンも、再開します。<br>みなさま、本当にありがとうございました。</p>';
    var cv = document.createElement('canvas');
    HIBI.photo(cv, 'haruka', { nostamp: true });
    news.appendChild(cv);
    var cap = document.createElement('p');
    cap.style.textAlign = 'center';
    cap.textContent = '（店主と、はるか）';
    news.appendChild(cap);
    document.getElementById('ura').textContent = 'まいさん　すまない';
    DWD.sfx.chime();
    var started = false;
    function finale() {
      if (started) return;
      started = true;
      DWD.sfx.heartbeat(4, 0.8);
      setTimeout(function () {
        cap.textContent = 'はるかは　19さいの　まま　でした';
        DWD.sfx.whisper(2);
      }, 1500);
      setTimeout(function () {
        HIBI.photo(cv, 'haruka', { nostamp: true, black: true });
        DWD.sfx.blip();
        document.getElementById('ura').classList.add('show');
      }, 3200);
      setTimeout(function () {
        var p = document.createElement('p');
        p.style.color = '#a0101a';
        p.textContent = 'かえってきた　はるかは　コーヒーを　のまない。　ずっと　かべを　みている。';
        news.appendChild(p);
        DWD.sfx.stinger();
      }, 5200);
      setTimeout(function () {
        var p = document.createElement('p');
        p.style.color = '#a0101a';
        p.textContent = 'かわりに　はいったのは　' + DWD.who() + '。　203号室の　かぎは　あいています。';
        news.appendChild(p);
        document.getElementById('cafeTitle').textContent = '喫茶 こもれび（休業中）';
        document.getElementById('counter').textContent = '000001';
      }, 7400);
      setTimeout(function () {
        DWD.scare({ type: 'girl', dur: 1500 }).then(function () {
