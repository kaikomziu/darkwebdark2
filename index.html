    function bindSubmit(submitFn) {
      var sending = false;
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (sending) return;
        var ms = DWD.get('rtaPending');
        var name = document.getElementById('rtaName').value.trim().slice(0, 12);
        if (!name) { msg.textContent = '名前を入れてください。'; return; }
        if (typeof ms !== 'number' || ms < MIN_MS || ms > MAX_MS) { msg.textContent = 'このタイムは登録できません。'; return; }
        sending = true;
        sendBtn.disabled = true;
        msg.textContent = '登録中…';
        submitFn(name, Math.round(ms)).then(function (best) {
          msg.textContent = typeof best === 'number' && best < ms

          DWD.set('rtaPending', null);
          form.hidden = true;
        }).catch(function (err) {
          msg.textContent = (err && err.userMessage) || '登録できませんでした。時間をおいてもう一度試してください。';
          sendBtn.disabled = false;
        }).then(function () { sending = false; });
      });
    }

    var backend = rankBackend();
    if (backend === 'supabase') return supabaseRanking();
    if (backend === 'claude') return claudeRanking();
    note('オンラインランキングは、公開サイトで開いたときに使えます。');

    /* ---- Supabase ---- */
    function supabaseRanking() {
      // ブラウザごとの匿名ID（1人1件の記録に使う）
      var pid = DWD.get('pid');
      if (typeof pid !== 'string' || pid.length < 16) {
        var a = new Uint8Array(16);
        (window.crypto || window.msCrypto).getRandomValues(a);
        pid = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
        DWD.set('pid', pid);
      }
      function api(path, opt) {
        opt = opt || {};
        var ctrl = window.AbortController ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000);
        return fetch(SB_URL + path, {
          method: opt.method || 'GET',
          headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
          body: opt.body ? JSON.stringify(opt.body) : undefined,
          signal: ctrl ? ctrl.signal : undefined
        }).then(function (r) {
          clearTimeout(timer);
          if (!r.ok) { var e = new Error('http ' + r.status); e.status = r.status; throw e; }
          return r.json();
        }, function (e) { clearTimeout(timer); throw e; });
      }
      function load() {
        return api('/rest/v1/' + TABLE + '?select=player_id,name,ms&order=ms.asc,updated_at.asc&limit=50').then(function (rows) {
          showRows((Array.isArray(rows) ? rows : []).map(function (r) {
            return { name: r.name, ms: r.ms, mine: r.player_id === pid };
          }));
        }).catch(function (e) {
          note(e && e.status === 404 ? 'ランキングは準備中です。' : 'ランキングを読み込めませんでした。通信状況を確認してください。');
        });
      }
      load();
      setInterval(load, 60000);
      bindSubmit(function (name, ms) {
        return api('/rest/v1/rpc/' + RPC, {
          method: 'POST',
          body: { p_player: pid, p_name: name, p_ms: ms, p_ver: DWD.VERSION }
        }).then(function (best) {
          load();
          return best;
        });
      });
    }

    /* ---- claude.ai の共有データベース ---- */
    function claudeRanking() {
      var tries = 0;
      (function waitClaude() {
        if (window.claude && typeof window.claude.use === 'function') return connect();
        if (++tries > 30) { note('ランキングを読み込めませんでした。'); return disableSend(); }
        setTimeout(waitClaude, 100);
      })();
      function connect() {
        Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
          var db = r[0], user = r[1];
          if (!db) { note('ランキングを読み込めませんでした（claude.ai にサインインすると表示されます）。'); return disableSend(); }
          return (user ? user.id() : Promise.resolve(null)).then(function (uid) {
            var loading = setTimeout(function () {
              if (list.querySelector('li.small')) note('ランキングにまだ接続できません。しばらくしてから開き直してください。');
            }, 10000);
            db.collection('rta2').orderBy('ms').limit(50).onSnapshot(function (snap) {
              if (!snap.metadata.fromCache) clearTimeout(loading);
              showRows(snap.docs.map(function (d) {
                var v = d.data() || {};
                return { name: v.name, ms: v.ms, mine: !!uid && d.id === uid };
              }));
            }, function () {
              clearTimeout(loading);
              note('ランキングを読み込めませんでした。');
            });
            if (!uid) return disableSend('ランキングに登録するには claude.ai へのサインインが必要です。');
            bindSubmit(function (name, ms) {
              var ref = db.doc('rta2/' + uid);
              return ref.get().then(function (cur) {
                var old = cur.exists ? cur.data() : null;
                if (old && typeof old.ms === 'number' && old.ms <= ms) return old.ms;
                return ref.set({ name: name, ms: ms, at: new Date().toISOString(), ver: DWD.VERSION }).then(function () { return ms; });
              }).catch(function (err) {
                var e = new Error('db');
                if (err && err.code === 'invalid_argument') e.userMessage = 'この共有設定では登録できません（閲覧のみの権限です）。';
                throw e;
              });
            });
          });
        }).catch(function () {
          note('ランキングを読み込めませんでした。');
          disableSend();
        });
      }
    }
  }

  // 見たエンディング
  var END_NAMES = { 1: 'END1「ただいま」', 2: 'END2「こたえない」', 3: 'END3「おかえり、はるか」' };
  function endingsCard() {
    var seen = DWD.get('endings') || [];
    var box = document.createElement('section');
    box.className = 'card';
    var html = '<h3 style="margin:0 0 6px;font-size:15px">見たおわり（' + seen.length + ' / 3）</h3><ul class="endings">';
    [1, 2, 3].forEach(function (n) {
      html += '<li>' + (seen.indexOf(n) >= 0 ? END_NAMES[n] : '？？？') + '</li>';
    });
    html += '</ul>';
    html += '<p style="margin:12px 0 0"><button type="button" class="btn2 red" id="resetBtn">さいしょから</button> <span class="small">進行状況を消します（RTA・見たおわりは残ります）</span></p>';
    box.innerHTML = html;
    topCards.appendChild(box);
    document.getElementById('resetBtn').addEventListener('click', function () {
      DWD.reset();
      location.href = 'index.html';
    });
  }

  /* ------------------------------------------------------------
   * END1「ただいま」の舞台
   * ---------------------------------------------------------- */
  if (stage === 'end1') {
    DWD.gate({ title: '……　まぶしい', button: 'めを　あける' }).then(end1);
    return;
  }
  function end1() {
    document.body.classList.remove('cold');
    document.body.classList.add('warm');
    var banner = document.getElementById('banner');
    banner.innerHTML = 'おかえりなさい。<b>2026/11/05</b> に更新されました';
    document.getElementById('bio').textContent = 'カフェで働いてます☕ ねこ派。ゆきとは高校から🌙　ただいま！';
    var happy = { tm: '2026/11/05 12:13', body: 'ゆき、かえってきた！！！！😭😭😭\nこもれびでナポリタン食べたよ🍝\n心配してくれたみんな、ほんとうにありがとう。\nもう大丈夫。ぜんぶ、おわったよ。', photo: 'cafe2', cap: 'ゆきと。こもれびで', likes: 2, photoOpt: {} };
    renderPosts([happy].concat(POSTS));
    DWD.sfx.chime();
    setTimeout(function () { HIBI.toast('<b>ゆき</b> さんが いいね しました'); DWD.sfx.chime(); if (happy.likeBtn) happy.likeBtn.textContent = '♡ 3'; }, 1800);
    setTimeout(function () { HIBI.toast('<b>喫茶こもれび</b> さんが いいね しました'); if (happy.likeBtn) happy.likeBtn.textContent = '♡ 4'; }, 4200);
    var started = false;
    function finale() {
      if (started) return;
      started = true;
      var who = DWD.who();
      DWD.sfx.heartbeat(4, 0.8);
      setTimeout(function () {
        // 写真の二人の目が黒くなる
        HIBI.photo(happy.canvas, 'cafe2', { black: true });
        DWD.sfx.blip();
        HIBI.toast('<b>203</b> さんが いいね しました');
        if (happy.likeBtn) happy.likeBtn.textContent = '♡ 203';
      }, 1600);
      setTimeout(function () {
        document.body.classList.remove('warm');
        document.body.classList.add('cold');
        DWD.sfx.whisper(2);
        var bodyEl = happy.canvas.parentNode.querySelector('.body');
        bodyEl.textContent = 'ゆきは　でてきた。\nまいも　でてきた。\nクロも　でてきた。';
      }, 3600);
      setTimeout(function () {
        var bodyEl = happy.canvas.parentNode.querySelector('.body');
        bodyEl.innerHTML = '';
        var t = document.createElement('span');
        t.className = 'redtext';
        t.textContent = 'じゃあ　かべの　なかには　だれが　いるの？';
        bodyEl.appendChild(t);
        DWD.sfx.stinger();
        document.getElementById('banner').innerHTML = '';
        var b2 = document.createElement('span');
        b2.textContent = 'このアカウントは　いま　' + who + '　が　つかっています';
        document.getElementById('banner').appendChild(b2);
        document.getElementById('pname').textContent = who;
      }, 6200);
      setTimeout(function () {
        document.body.classList.add('dwd-shake');
        DWD.sfx.knock(3, 0.2);
      }, 8600);
      setTimeout(function () {
        document.body.classList.remove('dwd-shake');
        DWD.scare({ type: 'crawl' }).then(function () {
          return DWD.scare({ type: 'text', text: 'つぎは　あなたが　ノックする', dur: 1400 });
        }).then(function () {
          DWD.set('stage', null);
          DWD.go('end.html?e=1', 700);
        });
      }, 10000);
    }
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a');
      if (a) e.preventDefault();
      if (e.target.closest('.dwd-cfg, .dwd-cfgp, .viewer')) return;
      finale();
    }, true);
    setTimeout(finale, 9000);
  }

  /* ------------------------------------------------------------
   * ふだんの表示
   * ---------------------------------------------------------- */
  var cleared = DWD.get('cleared');
  if (cleared || (DWD.get('rtaUnlocked') && !DWD.rtaRunning())) rtaCard();
  if (cleared || clears) endingsCard();
  if (clears && !cleared) {
    document.getElementById('banner').innerHTML = 'おかえりなさい。　また　<b>203</b>　の　となりへ';
  }
  if (prevName) document.getElementById('fcount').textContent = '204';

  renderPosts(POSTS);
  var visits = HIBI.visit('index');
  renderDrafts(false);

  // 最初の画面の注意（音を鳴らすための入口ボタンをかねる）
  var warn =
    '※ このゲームには<b style="color:#e55">大きな音・突然の驚かし（ジャンプスケア）・点滅する表現</b>があります。<br>' +
    'イヤホン・音量にご注意ください。下の設定で点滅と揺れを弱められます（あとから左下の⚙でも変更できます）。<br><br>' +
    '前作「DarkWebDark」の続編です。前作を遊んでいなくても楽しめます。<br>スマホ・PC 両対応。1周 40〜60分ほど。進行状況はブラウザに自動で保存されます。';
  var title = 'まい　の　ページを　ひらきますか';
  if (prevName && DWD.prevCleared() && visits === 1) title = 'おかえりなさい、' + prevName + '。\nまた　ノックが　きこえましたか';
  DWD.gate({ title: title, button: 'ひらく', warn: warn, settings: true }).then(function () {
    DWD.roomTone(0.07);
    // 2回目以降の訪問で、下書きが勝手に1件ふえる
    if (visits > 1 && grow(false)) renderDrafts(true);
    // 最初の不気味な一押し
    setTimeout(function () {
      DWD.sfx.buzz(2);
      HIBI.toast('<b>203</b> さんが「ゆきの部屋、見てくる」に いいね しました');
      if (POSTS[0].likeBtn) POSTS[0].likeBtn.textContent = '♡ 204';
    }, 4000);
    setTimeout(function () {
      if ((DWD.get('drafts') || 0) === 0) {
        HIBI.toast('まい さんが <b>下書き</b> を 保存しました');
        DWD.sfx.ping(true);
        document.getElementById('dcnt').textContent = '1';
      }
    }, 9000);
    // 最終ログインがじわじわ変わる
    var ll = document.getElementById('lastlogin');
    setInterval(function () { ll.textContent = '最終ログイン：' + DWD.clock(new Date(), true) + '（' + DWD.device() + '）'; }, 1000);
    // まれに怪現象（大きな驚かしはなし）
    DWD.haunt({ min: 20000, max: 40000, big: false, textSel: '.post .body', paused: function () { return !!document.querySelector('.viewer,.modal'); } });
  });
})();
</script>
